# Render blueprint: one web service. The database is Supabase (see README), so
# there is no Render Postgres here; its free tier is time-limited.
#
#   https://render.com/deploy?repo=https://github.com/gabrielcnog/we-zjuers
#
# The service runs in DEMO_MODE, which is what makes it safe to leave on the
# open internet: read-only, no sign-up, one shared demo account, and the sample
# data loads itself into the empty database on first boot (app/lib/snapshot.mjs).
# Nothing to seed by hand. The one thing to set is DATABASE_URL (below).
services:
  - type: web
    name: we-zjuers
    runtime: node
    plan: free
    region: singapore      # nearest to Hangzhou; Supabase is in Tokyo (ap-northeast-1)
    autoDeploy: true
    # The server reads ../design, so build and run from the repo root and
    # step into app/ rather than setting rootDir.
    buildCommand: cd app && npm ci
    startCommand: cd app && node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production      # Secure cookies; the sign-in code is never shown on screen
      - key: DEMO_MODE
        value: "1"
      # Bug reports forward to a Google Sheet. Set these two by hand after the
      # first deploy (docs/bug-reports.md); without them reports are only stored.
      - key: BUG_SHEET_URL
        sync: false
      - key: BUG_SHEET_TOKEN
        sync: false
      # The Supabase session-pooler connection string. Set it by hand in the
      # dashboard (Environment); it contains the database password, so it is
      # never written to this file.
      - key: DATABASE_URL
        sync: false
