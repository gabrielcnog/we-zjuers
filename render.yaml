# Render blueprint: one web service and one Postgres database.
#
#   https://render.com/deploy?repo=https://github.com/gabrielcnog/we-zjuers
#
# The service runs in DEMO_MODE, which is what makes it safe to leave on the
# open internet: read-only, no sign-up, one shared demo account, and the sample
# data loads itself into the empty database on first boot (app/lib/snapshot.mjs).
# Nothing to seed by hand and no API keys to set.
databases:
  - name: we-zjuers-db
    plan: free
    databaseName: wezjuers
    user: wezjuers
    ipAllowList: []          # the app reaches it over Render's private network; nothing else may

services:
  - type: web
    name: we-zjuers
    runtime: node
    plan: free
    autoDeploy: true
    # The server reads ../design, so build and run from the repo root and
    # step into app/ rather than setting rootDir.
    buildCommand: cd app && npm ci
    startCommand: cd app && node server.mjs
    healthCheckPath: /en/community
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production      # Secure cookies; the sign-in code is never shown on screen
      - key: DEMO_MODE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: we-zjuers-db
          property: connectionString
